name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-check:
    name: Lint and syntax check (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: |
          python -m pip install --disable-pip-version-check --no-deps --only-binary=:all: \
            --require-hashes -r .github/uv-bootstrap.txt

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint with ruff
        run: uv run ruff check bbackup/ scripts/ tests/

      - name: Check syntax (py_compile)
        run: |
          uv run python -m py_compile bbackup.py bbman.py
          uv run python -m py_compile bbackup/*.py
          uv run python -m py_compile bbackup/data/*.py
          uv run python -m py_compile bbackup/management/*.py
          uv run python -m py_compile scripts/*.py

      - name: Check imports
        run: |
          uv run python -c "from bbackup.config import Config; print('config OK')"
          uv run python -c "from bbackup.cli import cli; print('cli OK')"
          uv run python -c "from bbackup.encryption import EncryptionManager; print('encryption OK')"
          uv run python -c "from bbackup.remote import RemoteStorage; print('remote OK')"
          uv run python -c "from bbackup.rotation import BackupRotation; print('rotation OK')"

      - name: Verify version references are in sync
        run: uv run python scripts/check_version_sync.py

      - name: Verify publishing checklist is present
        run: |
          test -f docs/PUBLISHING_CHECKLIST.md
          test -f SUPPORT.md

      - name: Verify publishing readiness
        run: uv run python scripts/check_publishing_ready.py

      - name: Verify public Markdown standards
        run: |
          uv run python scripts/check_markdown_standards.py
          uv run python scripts/check_assets.py

      - name: Verify installed artifact smoke test
        run: |
          uv build
          uv run python scripts/smoke_installed_artifact.py

  test:
    name: Unit tests (Python ${{ matrix.python-version }})
    needs: lint-and-check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: |
          python -m pip install --disable-pip-version-check --no-deps --only-binary=:all: \
            --require-hashes -r .github/uv-bootstrap.txt

      - name: Install dependencies
        run: uv sync --locked

      - name: Run unit tests with coverage
        run: uv run pytest tests/ -m "not integration" --cov=bbackup --cov-report=xml --cov-report=term-missing

      - name: Upload coverage artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml

      - name: Verify CLI skills docs are up to date
        run: uv run python scripts/generate_cli_skills.py --check

  restore-boundary-test:
    name: Restore boundary and failure tests
    needs: lint-and-check
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install uv
        env:
          UV_VERSION: "0.13.4"
          UV_SHA256: "05e4332791b4d55b6dde8695b7fa6079b26991519f44760887c5dfbd5ca4fe53"
        run: |
          set -euo pipefail
          printf 'uv==%s --hash=sha256:%s\n' "$UV_VERSION" "$UV_SHA256" \
            > "$RUNNER_TEMP/uv-requirements.txt"
          python -m pip install \
            --disable-pip-version-check \
            --no-deps \
            --only-binary=:all: \
            --require-hashes \
            -r "$RUNNER_TEMP/uv-requirements.txt"
          test "$(uv --version | cut -d' ' -f2)" = "$UV_VERSION"

      - name: Install dependencies
        run: uv sync --locked

      - name: Run restore boundary tests
        run: >-
          uv run pytest tests/test_filesystem_backup.py
          -k "restore_backup_returns_structured_failure or restore_backup_rejects_ or rsync_failure"
          -v --tb=short

  integration-test:
    name: Integration tests
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install uv
        run: |
          python -m pip install --disable-pip-version-check --no-deps --only-binary=:all: \
            --require-hashes -r .github/uv-bootstrap.txt

      - name: Install dependencies
        run: uv sync --locked

      - name: Install pinned restic
        env:
          RESTIC_VERSION: "0.19.1"
          RESTIC_SHA256: "f415415624dcc452f2a02b8c33641791a8c6d6d3b65bbb3543fcf9a25151585c"
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/restic_${RESTIC_VERSION}_linux_amd64.bz2"
          binary="$RUNNER_TEMP/restic"
          curl --fail --location --retry 3 \
            --output "$archive" \
            "https://github.com/restic/restic/releases/download/v${RESTIC_VERSION}/restic_${RESTIC_VERSION}_linux_amd64.bz2"
          echo "${RESTIC_SHA256}  ${archive}" | sha256sum --check -
          bunzip2 --stdout "$archive" > "$binary"
          chmod 0755 "$binary"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$binary" version


      - name: Run integration tests
        run: |
          command -v rsync
          uv run pytest tests/ -m integration -v --tb=short

  required:
    name: CI required
    if: always()
    needs: [lint-and-check, test, restore-boundary-test, integration-test]
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Require every validation job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ["RESULTS"])
          failures = [name for name, result in results.items() if result["result"] != "success"]
          if failures:
              raise SystemExit("Required validation did not succeed: " + ", ".join(failures))
          PY
