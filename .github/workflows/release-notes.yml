name: Create GitHub release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Create release from tag
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv


      - name: Install pinned restic
        env:
          RESTIC_VERSION: "0.19.1"
          RESTIC_SHA256: "f415415624dcc452f2a02b8c33641791a8c6d6d3b65bbb3543fcf9a25151585c"
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/restic_${RESTIC_VERSION}_linux_amd64.bz2"
          binary="$RUNNER_TEMP/restic"
          curl --fail --location --retry 3 \
            --output "$archive" \
            "https://github.com/restic/restic/releases/download/v${RESTIC_VERSION}/restic_${RESTIC_VERSION}_linux_amd64.bz2"
          echo "${RESTIC_SHA256}  ${archive}" | sha256sum --check -
          bunzip2 --stdout "$archive" > "$binary"
          chmod 0755 "$binary"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$binary" version
      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Verify release version and publishing readiness
        run: |
          test "${{ steps.version.outputs.version }}" = "$(cat VERSION)"
          uv sync --locked
          uv run python scripts/check_version_sync.py
          uv run python scripts/check_publishing_ready.py
          uv run python scripts/check_markdown_standards.py
          uv run ruff check bbackup/ scripts/check_markdown_standards.py scripts/check_publishing_ready.py scripts/check_version_sync.py scripts/smoke_installed_artifact.py scripts/generate_cli_skills.py tests/
          uv run python scripts/generate_cli_skills.py --check
          uv run python -m py_compile bbackup.py bbman.py bbackup/*.py bbackup/data/*.py bbackup/management/*.py scripts/*.py
          uv run pytest

      - name: Extract changelog section for this version
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Pull the block between the version header and the next version header
          NOTES=$(awk "/^## \[$VERSION\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            echo "No CHANGELOG.md section found for v$VERSION" >&2
            exit 1
          fi
          # Write to file to preserve newlines
          echo "$NOTES" > release_notes.txt

      - name: Build release artifacts
        run: uv build

      - name: Smoke test built wheel
        run: uv run python scripts/smoke_installed_artifact.py

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: "v${{ steps.version.outputs.version }}"
          body_path: release_notes.txt
          files: |
            dist/bbackup-*.tar.gz
            dist/bbackup-*.whl
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          make_latest: ${{ contains(steps.version.outputs.version, '-') && 'false' || 'true' }}
