name: Create GitHub release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful tag-build workflow run ID
        required: true
        type: string
      tag:
        description: Exact tag produced by that build
        required: true
        type: string
      detached_signature:
        description: ASCII-armored detached signature for SHA256SUMS
        required: true
        type: string

permissions: {}

jobs:
  source-validation:
    if: github.event_name == 'push'
    name: Validate source and build portable artifacts
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - name: Install pinned uv
        run: |
          set -euo pipefail
          printf 'uv==0.13.4 --hash=sha256:%s\n' \
            '05e4332791b4d55b6dde8695b7fa6079b26991519f44760887c5dfbd5ca4fe53' \
            > "$RUNNER_TEMP/uv-requirements.txt"
          python -m pip install --disable-pip-version-check --require-hashes \
            --requirement "$RUNNER_TEMP/uv-requirements.txt"
          uv --version

      - name: Extract and verify tag version
        id: version
        run: |
          set -euo pipefail
          version="${GITHUB_REF#refs/tags/v}"
          test -n "$version"
          test "$version" = "$(cat VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Require signed tag and exact default-branch CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist/release-source
          python3 scripts/verify_release_source.py \
            --repository "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" \
            > dist/release-source/source-verification.json
          python3 -m json.tool dist/release-source/source-verification.json > /dev/null

      - name: Verify release readiness
        run: |
          set -euo pipefail
          uv sync --locked
          uv run python scripts/check_version_sync.py
          uv run python scripts/check_publishing_ready.py
          uv run python scripts/check_markdown_standards.py
          uv run ruff check bbackup/ scripts/ tests/
          uv run python scripts/generate_cli_skills.py --check
          uv run python -m py_compile bbackup.py bbman.py bbackup/*.py bbackup/data/*.py bbackup/management/*.py scripts/*.py

      - name: Extract changelog section
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          awk -v version="$version" '
            $0 == "## [" version "]" || index($0, "## [" version "] - ") == 1 { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release_notes.txt
          test -s release_notes.txt

      - name: Build source archives
        run: |
          set -euo pipefail
          uv build
          uv run python scripts/smoke_installed_artifact.py
          mkdir -p dist/release-source
          cp dist/bbackup-*.whl dist/bbackup-*.tar.gz dist/release-source/
          cp release_notes.txt dist/release-source/

      - name: Upload source archives
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-source
          path: dist/release-source/*
          if-no-files-found: error
          retention-days: 14

  build-deb:
    if: github.event_name == 'push'
    name: Ubuntu ${{ matrix.release }} ${{ matrix.architecture }} native package
    needs: source-validation
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    container:
      image: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - release: "24.04"
            architecture: amd64
            runner: ubuntu-24.04
            container: ubuntu:24.04@sha256:534baea6a22c03a63003dbc8dbe78fe34bc0d7e595d9a9dc9834884ff530eb55
            restic_archive_sha256: f415415624dcc452f2a02b8c33641791a8c6d6d3b65bbb3543fcf9a25151585c
            uv_sha256: 05e4332791b4d55b6dde8695b7fa6079b26991519f44760887c5dfbd5ca4fe53
          - release: "24.04"
            architecture: arm64
            runner: ubuntu-24.04-arm
            container: ubuntu:24.04@sha256:534baea6a22c03a63003dbc8dbe78fe34bc0d7e595d9a9dc9834884ff530eb55
            restic_archive_sha256: a5f64aaab53d51e311fa3829124c5b703f2d14cf187d8640b6be3b2b49376465
            uv_sha256: 7b3cdf868e5415631fe797b648c0d6945d38d388f23367bdd0b6332e80a1fcb0
          - release: "26.04"
            architecture: amd64
            runner: ubuntu-24.04
            container: ubuntu:26.04@sha256:f144425ff09be612d6d9ad965196e9cdc23dae1f42110a8a11a3e9a8198759f7
            restic_archive_sha256: f415415624dcc452f2a02b8c33641791a8c6d6d3b65bbb3543fcf9a25151585c
            uv_sha256: 05e4332791b4d55b6dde8695b7fa6079b26991519f44760887c5dfbd5ca4fe53
          - release: "26.04"
            architecture: arm64
            runner: ubuntu-24.04-arm
            container: ubuntu:26.04@sha256:f144425ff09be612d6d9ad965196e9cdc23dae1f42110a8a11a3e9a8198759f7
            restic_archive_sha256: a5f64aaab53d51e311fa3829124c5b703f2d14cf187d8640b6be3b2b49376465
            uv_sha256: 7b3cdf868e5415631fe797b648c0d6945d38d388f23367bdd0b6332e80a1fcb0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1

      - name: Download validated source wheel
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-source
          path: source

      - name: Install target build tools
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            bzip2 ca-certificates curl dpkg-dev python3-packaging python3-venv systemd util-linux
          /usr/bin/python3 -c 'from packaging.requirements import InvalidRequirement, Requirement; from packaging.utils import canonicalize_name'
          /usr/bin/python3 --version
          case "${{ matrix.release }}" in
            24.04) /usr/bin/python3 -c 'import sys; assert sys.version_info[:2] == (3, 12)' ;;
            26.04) /usr/bin/python3 -c 'import sys; assert sys.version_info[:2] == (3, 14)' ;;
            *) exit 1 ;;
          esac
          mkdir -p /opt/bbackup-build-tools
          /usr/bin/python3 -m venv /opt/bbackup-build-tools/uv
          printf 'uv==0.13.4 --hash=sha256:%s\n' '${{ matrix.uv_sha256 }}' \
            > "$RUNNER_TEMP/uv-requirements.txt"
          /opt/bbackup-build-tools/uv/bin/python -m pip install \
            --disable-pip-version-check --require-hashes \
            --requirement "$RUNNER_TEMP/uv-requirements.txt"
          /opt/bbackup-build-tools/uv/bin/uv --version
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/restic.bz2" \
            "https://github.com/restic/restic/releases/download/v0.19.1/restic_0.19.1_linux_${{ matrix.architecture == 'amd64' && 'amd64' || 'arm64' }}.bz2"
          # The matrix pins the official archive; the builder expects the unpacked executable digest.
          echo '${{ matrix.restic_archive_sha256 }}  '"$RUNNER_TEMP/restic.bz2" | sha256sum --check -
          bunzip2 --stdout "$RUNNER_TEMP/restic.bz2" > "$RUNNER_TEMP/restic"
          chmod 0755 "$RUNNER_TEMP/restic"
          printf 'RESTIC_EXECUTABLE_SHA256=%s\n' \
            "$(sha256sum "$RUNNER_TEMP/restic" | awk '{print $1}')" >> "$GITHUB_ENV"
          useradd --uid 1001 --user-group --create-home --shell /bin/sh packagebuilder
          chown -R 1001:1001 "$GITHUB_WORKSPACE"

      - name: Build package as an unprivileged user
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(find source -maxdepth 1 -type f -name 'bbackup-*.whl' -print -quit)"
          test -n "$wheel"
          install -d -o 1001 -g 1001 dist/deb
          runuser -u packagebuilder -- env \
            HOME=/home/packagebuilder \
            PATH="/opt/bbackup-build-tools/uv/bin:/usr/local/bin:/usr/bin:/bin" \
            /usr/bin/python3 scripts/build_deb.py \
              --target-release '${{ matrix.release }}' \
              --wheel "$GITHUB_WORKSPACE/$wheel" \
              --restic "$RUNNER_TEMP/restic" \
              --restic-sha256 "$RESTIC_EXECUTABLE_SHA256" \
              --output-dir dist/deb

      - name: Install and inspect package in target container
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(dist/deb/*.deb)
          test "${#packages[@]}" -eq 1
          dpkg --install "${packages[0]}"
          dpkg-query --show --showformat='${Version}\n' bbackup
          bbackup --version
          bbman --help
          test -s /usr/lib/bbackup/payload.sha256
          test -s /usr/lib/systemd/system/bbackup@.service
          test -s /usr/lib/systemd/system/bbackup@.timer
          test ! -e /etc/systemd/system/timers.target.wants/bbackup@.timer
          systemd-analyze verify \
            /usr/lib/systemd/system/bbackup@.service \
            /usr/lib/systemd/system/bbackup@.timer

      - name: Upload target package artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bbackup-deb-ubuntu${{ matrix.release }}-${{ matrix.architecture }}
          path: dist/deb/*
          if-no-files-found: error
          retention-days: 14

  assemble-release-inputs:
    if: github.event_name == 'push'
    name: Assemble checksummed release inputs
    needs:
      - source-validation
      - build-deb
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download source archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-source
          path: release-inputs

      - name: Download target package outputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: "bbackup-deb-*"
          merge-multiple: true
          path: release-inputs

      - name: Bind release inputs to verified source and create checksum inventory
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_BUILD_RUN_ID: ${{ github.run_id }}
          RELEASE_BUILD_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 scripts/generate_release_provenance.py \
            --release-inputs release-inputs \
            --repository "$RELEASE_REPOSITORY" \
            --tag "$RELEASE_TAG" \
            --commit "$RELEASE_COMMIT" \
            --build-run-id "$RELEASE_BUILD_RUN_ID" \
            --build-run-url "$RELEASE_BUILD_RUN_URL"
          (
            cd release-inputs
            find . -maxdepth 1 -type f \
              ! -name 'SHA256SUMS' ! -name 'release_notes.txt' \
              -printf '%f\n' | LC_ALL=C sort | while IFS= read -r file; do
                sha256sum "$file"
              done > SHA256SUMS
          )
          (
            cd release-inputs
            for checksum in bbackup_*_ubuntu*.sha256; do
              sha256sum --check "$checksum"
            done
          )
          test -s release-inputs/SHA256SUMS
          (cd release-inputs && sha256sum --check SHA256SUMS)

      - name: Upload immutable unsigned build inputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-inputs
          path: release-inputs/*
          if-no-files-found: error
          retention-days: 14

  publish-release:
    if: github.event_name == 'workflow_dispatch'
    name: Verify operator signature and publish
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Validate build-run and tag binding
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$RELEASE_TAG" =~ ^v[A-Za-z0-9.+_-]+$ ]]
          default_branch="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.default_branch')"
          test "$GITHUB_REF_NAME" = "$default_branch"
          workflow_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/release-notes.yml" --jq '.id')"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BUILD_RUN_ID}" > "$RUNNER_TEMP/build-run.json"
          jq -e \
            --arg tag "$RELEASE_TAG" \
            --argjson workflow_id "$workflow_id" \
            '.event == "push"
             and .status == "completed"
             and .conclusion == "success"
             and .head_branch == $tag
             and .workflow_id == $workflow_id
             and .path == ".github/workflows/release-notes.yml"' \
            "$RUNNER_TEMP/build-run.json" > /dev/null
          expected_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_TAG}" --jq '.sha')"
          actual_sha="$(jq -r '.head_sha' "$RUNNER_TEMP/build-run.json")"
          test "$actual_sha" = "$expected_sha"
      - name: Download exact successful build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-inputs
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release-inputs

      - name: Load public release verification certificate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: release-verification
          fetch-depth: 0
          sparse-checkout: |
            .github/release-signing-key.asc
            scripts/verify_release_source.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Recheck trusted release source before publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: >-
          python3 release-verification/scripts/verify_release_source.py
          --repository "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" --checkout release-verification

      - name: Verify checksum inventory and fixed-fingerprint signature
        env:
          DETACHED_SIGNATURE: ${{ inputs.detached_signature }}
        run: |
          set -euo pipefail
          expected_fingerprint=AF7968466B5B39C5E928FEFE716342D3EFBA5522
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 0700 "$GNUPGHOME"
          printf '%s\n' "$DETACHED_SIGNATURE" > "$RUNNER_TEMP/SHA256SUMS.asc"
          grep -qx -- '-----BEGIN PGP SIGNATURE-----' "$RUNNER_TEMP/SHA256SUMS.asc"
          python3 - <<'PY'
          import re
          from pathlib import Path

          root = Path("release-inputs")
          listed = set()
          for line in (root / "SHA256SUMS").read_text(encoding="utf-8").splitlines():
              match = re.fullmatch(r"[0-9a-f]{64}  ([A-Za-z0-9_.+~-]+)", line)
              assert match is not None, "Malformed checksum entry"
              name = match.group(1)
              assert name not in (".", "..") and name not in listed, "Unsafe or duplicate checksum entry"
              listed.add(name)
          actual = {path.name for path in root.iterdir()
                    if path.is_file() and path.name not in {"SHA256SUMS", "release_notes.txt"}}
          assert listed == actual, "Unsigned or missing release artifact"
          assert all(path.is_file() and not path.is_symlink() for path in root.iterdir()), "Unexpected release member"
          PY
          (
            cd release-inputs
            sha256sum --check SHA256SUMS
          )
          gpg --batch --import release-verification/.github/release-signing-key.asc
          imported_fingerprint="$(
            gpg --batch --with-colons --fingerprint "$expected_fingerprint" |
              awk -F: '$1 == "fpr" { print $10; exit }'
          )"
          test "$imported_fingerprint" = "$expected_fingerprint"
          gpg --batch --status-fd=1 \
            --verify "$RUNNER_TEMP/SHA256SUMS.asc" release-inputs/SHA256SUMS \
            > "$RUNNER_TEMP/gpg-status.txt"
          awk -v fingerprint="$expected_fingerprint" \
            '$1 == "[GNUPG:]" && $2 == "VALIDSIG" && ($3 == fingerprint || $NF == fingerprint) \
             && ($10 == "8" || $10 == "9" || $10 == "10") { valid=1 }
             END { exit !valid }' "$RUNNER_TEMP/gpg-status.txt"

      - name: Publish signed release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/SHA256SUMS.asc" release-inputs/SHA256SUMS.asc
          assets=()
          while IFS= read -r -d '' file; do
            assets+=("$file")
          done < <(find release-inputs -maxdepth 1 -type f \
            ! -name 'release_notes.txt' ! -name 'SHA256SUMS.asc' -print0 | sort -z)
          assets+=("$GITHUB_WORKSPACE/release-inputs/SHA256SUMS.asc")
          release_args=(--draft --verify-tag --title "$RELEASE_TAG" --notes-file release-inputs/release_notes.txt)
          if [[ "$RELEASE_TAG" == *-* ]]; then
            release_args+=(--prerelease)
          fi

          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            > "$RUNNER_TEMP/releases-before-create.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          def pages(path):
              text = Path(path).read_text(encoding="utf-8")
              decoder = json.JSONDecoder()
              position = 0
              while position < len(text):
                  while position < len(text) and text[position].isspace():
                      position += 1
                  if position == len(text):
                      break
                  page, position = decoder.raw_decode(text, position)
                  if not isinstance(page, list):
                      raise SystemExit("GitHub releases API returned a non-list page")
                  yield page

          tag = os.environ["RELEASE_TAG"]
          matches = [release for page in pages(
              Path(os.environ["RUNNER_TEMP"]) / "releases-before-create.json"
          ) for release in page if release.get("tag_name") == tag]
          if matches:
              raise SystemExit(f"A release for {tag} already exists; refusing to create a duplicate.")
          PY

          gh release create "$RELEASE_TAG" "${assets[@]}" "${release_args[@]}" \
            --repo "$GITHUB_REPOSITORY"

          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            > "$RUNNER_TEMP/releases-after-create.json"
          python3 - <<'PYVERIFY'
          import hashlib
          import json
          import os
          from pathlib import Path

          def pages(path):
              text = Path(path).read_text(encoding="utf-8")
              decoder = json.JSONDecoder()
              position = 0
              while position < len(text):
                  while position < len(text) and text[position].isspace():
                      position += 1
                  if position == len(text):
                      break
                  page, position = decoder.raw_decode(text, position)
                  if not isinstance(page, list):
                      raise SystemExit("GitHub releases API returned a non-list page")
                  yield page

          tag = os.environ["RELEASE_TAG"]
          matches = [release for page in pages(
              Path(os.environ["RUNNER_TEMP"]) / "releases-after-create.json"
          ) for release in page if release.get("tag_name") == tag]
          if len(matches) != 1:
              raise SystemExit(f"Expected one release for {tag}, found {len(matches)}.")
          draft = matches[0]
          release_id = draft.get("id")
          if (type(release_id) is not int or release_id < 1
                  or draft.get("tag_name") != tag or draft.get("draft") is not True):
              raise SystemExit("The matching release is not the expected draft identity.")
          expected_body = Path("release-inputs/release_notes.txt").read_text(encoding="utf-8").strip()
          actual_body = draft.get("body")
          if not isinstance(actual_body, str) or actual_body.strip() != expected_body:
              raise SystemExit("Draft release notes differ from the signed release notes.")
          expected = {}
          for path in Path("release-inputs").iterdir():
              if path.name == "release_notes.txt":
                  continue
              with path.open("rb") as stream:
                  digest = "sha256:" + hashlib.file_digest(stream, "sha256").hexdigest()
              expected[path.name] = (path.stat().st_size, digest)
          actual = {}
          for asset in draft.get("assets", []):
              name = asset.get("name")
              if not isinstance(name, str) or name in actual:
                  raise SystemExit("Draft release has an invalid or duplicate asset name.")
              actual[name] = (asset.get("size"), asset.get("digest"))
          if actual != expected:
              raise SystemExit("Draft asset inventory or SHA256 differs.")
          (Path(os.environ["RUNNER_TEMP"]) / "verified-release-id").write_text(
              f"{release_id}\n", encoding="ascii"
          )
          PYVERIFY

          release_id="$(cat "$RUNNER_TEMP/verified-release-id")"
          [[ "$release_id" =~ ^[1-9][0-9]*$ ]]
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
            -F draft=false > "$RUNNER_TEMP/published-release.json"
          python3 - <<'PYPUBLISHED'
          import json
          import os
          from pathlib import Path

          release = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "published-release.json").read_text(encoding="utf-8")
          )
          expected_id = int((Path(os.environ["RUNNER_TEMP"]) / "verified-release-id").read_text())
          if (release.get("id") != expected_id
                  or release.get("tag_name") != os.environ["RELEASE_TAG"]
                  or release.get("draft") is not False):
              raise SystemExit("GitHub did not publish the verified release ID.")
          PYPUBLISHED
