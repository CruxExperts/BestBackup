[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bbackup"
version = "2.0.0-alpha.1"
description = "Encrypted Linux backups with restic, cloud replication, and a visual dashboard"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
  { name = "Slavic Kozyuk / Crux Experts LLC" },
]
keywords = [
  "docker",
  "backup",
  "containers",
  "volumes",
  "tui",
  "rsync",
  "encryption",
  "restore",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: System Administrators",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Archiving :: Backup",
]
dependencies = [
  "rich>=13.7.0",
  "pyyaml>=6.0.1",
  "docker>=7.0.0",
  "click>=8.1.7",
  "paramiko>=3.4.0",
  "cryptography>=50.0.0",
  "requests>=2.31.0",
  "textual==8.2.8",
  "boto3==1.43.108",
  "urllib3>=2.8.0",
  "b2sdk==2.13.0",
]

[project.optional-dependencies]
gdrive-auth = [
  "google-auth-oauthlib>=1.4.0,<2",
  "oauthlib>=3.2.1",
  "requests-oauthlib>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/CruxExperts/best-backup"
Repository = "https://github.com/CruxExperts/best-backup"
Issues = "https://github.com/CruxExperts/best-backup/issues"

[project.scripts]
bbackup = "bbackup.cli:cli"
bbman = "bbackup.bbman_entry:cli"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pytest-mock>=3.14",
  "pytest-xdist>=3.8,<4",
  "ruff>=0.8.0",
]

[tool.setuptools.packages.find]
include = ["bbackup*"]

[tool.setuptools.package-data]
"bbackup.data" = ["*.example", "*.md", "*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n auto --dist worksteal --tb=short -q"
markers = [
  "integration: marks tests requiring live external tools such as Docker or restic (deselect with -m 'not integration')",
]

[tool.ruff]
target-version = "py312"
