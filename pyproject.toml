[build-system]
requires = ["setuptools==84.1.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bbackup"
version = "2.0.6"
description = "Local-first encrypted Linux backups with restic and a visual dashboard"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
  { name = "Slavic Kozyuk / Crux Experts LLC" },
]
keywords = [
  "docker",
  "backup",
  "containers",
  "volumes",
  "tui",
  "rsync",
  "encryption",
  "restore",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: System Administrators",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Archiving :: Backup",
]
dependencies = [
  "rich>=13.7.0",
  "pyyaml>=6.0.1",
  "docker>=7.2.0",
  "click>=8.5.0",
  "paramiko>=5.1.0",
  "cryptography>=50.0.2",
  "requests>=2.31.0",
  "textual==8.2.8",
  "boto3==1.43.114",
  "urllib3>=2.8.0",
  "b2sdk==2.13.1",
]

[project.optional-dependencies]
gdrive-auth = [
  "google-auth-oauthlib>=1.5.0,<2",
  "oauthlib>=4.0.0",
  "requests-oauthlib>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/CruxExperts/BestBackup"
Repository = "https://github.com/CruxExperts/BestBackup"
Issues = "https://github.com/CruxExperts/BestBackup/issues"

[project.scripts]
bbackup = "bbackup.cli:cli"
bbman = "bbackup.bbman_entry:cli"

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "pytest-cov>=5.0",
  "pytest-mock>=3.17.0",
  "pytest-xdist>=3.8,<4",
  "ruff>=0.17.1",
]

[tool.setuptools.packages.find]
include = ["bbackup*"]

[tool.setuptools.package-data]
"bbackup.data" = ["*.example", "*.md", "*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n auto --dist worksteal --tb=short -q"
markers = [
  "integration: marks tests requiring live external tools such as Docker or restic (deselect with -m 'not integration')",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Preserve the established rule profile across Ruff's 0.16 default expansion.
select = ["E4", "E7", "E9", "F"]
